
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mood Farm · 情绪小农场</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <!-- Adding LXGW WenKai for that handwritten feel -->
    <link href="https://npm.elemecdn.com/lxgw-wenkai-screen-web/style.css" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              pixel: ['"VT323"', 'monospace'],
              hand: ['"LXGW WenKai Screen"', 'sans-serif'],
            },
            colors: {
              farm: {
                base: '#7bb15e', // Body BG
                container: '#e6d8b9', // Farm Container BG
                grid: '#7fa563', // Farm Grid BG
                cell: '#d8b28a', // Farm Cell BG
                
                grass: '#7bb15e',
                'grass-light': '#9bc782',
                'grass-dark': '#5d8a44',
                
                dirt: '#d8b28a',
                'dirt-dark': '#b08555',
                
                wood: '#6c3f1f', // Main border color
                'wood-light': '#8b5a2b',
                'wood-dark': '#5d3b1f',
                
                paper: '#f7e9cc', // Card BG
                accent: '#d87c4a', // Button color
                dark: '#4a2d1a' // Text/Shadows
              }
            },
            boxShadow: {
              'pixel': '4px 4px 0px 0px rgba(74, 45, 26, 0.4)',
              'pixel-sm': '2px 2px 0px 0px rgba(74, 45, 26, 0.4)',
              'pixel-inset': 'inset 4px 4px 0px 0px rgba(0,0,0,0.15)',
              'card': '0 4px 0px 0px #58351c',
            },
            animation: {
              'bounce-slow': 'bounce 3s infinite',
              'wiggle': 'wiggle 4s ease-in-out infinite',
              'pot-boil': 'pot-boil 0.5s ease-in-out infinite',
            },
            keyframes: {
              wiggle: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-2px)' },
              },
            }
          }
        }
      }
    </script>
    <style>
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 14px;
      }
      ::-webkit-scrollbar-track {
        background: #e6d8b9; 
        border-left: 2px solid #6c3f1f;
      }
      ::-webkit-scrollbar-thumb {
        background: #6c3f1f; 
        border: 2px solid #e6d8b9;
      }
      
      body {
        background-color: #7bb15e;
        margin: 0;
        overflow-x: hidden;
      }

      /* --- Weather Animation Keyframes --- */
      
      @keyframes sun-pulse {
        0%, 100% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(1.5); opacity: 0.6; }
      }

      @keyframes cloud-drift {
        from { transform: translateX(-20%); }
        to { transform: translateX(120vw); }
      }

      @keyframes rain-fall {
        0% { transform: translateY(-20px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(100vh); opacity: 0; }
      }

      @keyframes snow-fall {
        0% { transform: translateY(-10px) translateX(0); opacity: 0; }
        20% { opacity: 0.8; }
        100% { transform: translateY(100vh) translateX(20px); opacity: 0; }
      }

      @keyframes lightning-flash {
        0%, 90%, 100% { opacity: 0; }
        92% { opacity: 0.6; }
        93% { opacity: 0; }
        94% { opacity: 0.4; }
        96% { opacity: 0; }
      }

      /* --- Kitchen / Cooking Animations --- */
      
      @keyframes ingredient-drop {
        0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateY(40px) rotate(180deg); opacity: 0; }
      }

      @keyframes pot-boil {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        25% { transform: translateY(1px) rotate(-1deg); }
        75% { transform: translateY(-1px) rotate(1deg); }
      }

      @keyframes steam-rise {
        0% { transform: translateY(0) scale(1); opacity: 0.6; }
        100% { transform: translateY(-30px) scale(1.5); opacity: 0; }
      }
      
      @keyframes pop-in {
        0% { transform: scale(0); opacity: 0; }
        70% { transform: scale(1.1); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }

      /* --- Pet Animation System --- */
      
      .pet-wrapper {
          width: 80px;
          height: 80px;
          cursor: pointer;
          position: relative;
          margin: 0 auto;
          transition: transform 0.3s ease;
          /* Default Anchor point for rotations */
          transform-origin: center bottom; 
      }
      
      .pet-wrapper svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 2px 0 rgba(0,0,0,0.15));
      }

      /* 1. IDLE: Breathing */
      .pet-anim-idle {
          animation: petBreathe 3s infinite ease-in-out;
      }
      @keyframes petBreathe {
          0%   { transform: translateY(0); }
          50%  { transform: translateY(-4px); }
          100% { transform: translateY(0); }
      }
      
      /* 2. JUMP: Petting Interaction */
      .pet-anim-jump {
          animation: petJump 0.4s ease-out forwards;
      }
      @keyframes petJump {
          0%   { transform: translateY(0) scale(1); }
          30%  { transform: translateY(-12px) scale(1.1); }
          60%  { transform: translateY(-4px) scale(1.05); }
          100% { transform: translateY(0) scale(1); }
      }

      /* 3. SIT: Resting state (squash slightly and move down) */
      .pet-anim-sit {
          transform: translateY(6px) scaleY(0.95);
          filter: grayscale(0.2);
          transition: transform 0.5s ease;
      }

      /* 4. ROLL: Easter Egg */
      .pet-anim-roll {
          animation: petRoll 0.8s ease-in-out forwards;
      }
      @keyframes petRoll {
          0% { transform: rotate(0deg) translateY(0); }
          20% { transform: rotate(-10deg) translateY(-5px); }
          100% { transform: rotate(360deg) translateY(0); }
      }

      /* Heart Effects */
      .pet-wrapper::after {
          content: "";
          position: absolute;
          top: -10px;
          left: 50%;
          transform: translateX(-50%);
          width: 0;
          height: 0;
          opacity: 0;
          pointer-events: none;
      }

      .pet-wrapper.show-heart::after {
          content: "❤";
          width: 20px;
          height: 20px;
          opacity: 1;
          animation: heartFloat 0.8s ease-out;
          font-size: 24px;
          color: #ff6b6b;
          text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.5);
      }

      @keyframes heartFloat {
          0%   { transform: translateX(-50%) translateY(0) scale(0.5); opacity: 0; }
          20%  { transform: translateX(-50%) translateY(-10px) scale(1.2); opacity: 1; }
          100% { transform: translateX(-50%) translateY(-40px) scale(1); opacity: 0; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.4.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
